name: Sync Upstream Release

on:
  schedule:
    # Check official upstream for new releases every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      force_release:
        description: 'Force release sync even if tag exists locally'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  sync-official-release:
    name: Check & Sync Official Upstream Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    outputs:
      new_release_needed: ${{ steps.check_upstream.outputs.new_release_needed }}
      target_tag: ${{ steps.check_upstream.outputs.target_tag }}

    steps:
      - name: Checkout Fork
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git User
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add Upstream Remote
        run: |
          git remote add upstream https://github.com/EchoMusicApp/Echo-Music.git || git remote set-url upstream https://github.com/EchoMusicApp/Echo-Music.git
          git fetch origin --tags --force || true

      - name: Check for New Upstream Release
        id: check_upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Fetch latest release tag from official Echo Music repository
          UPSTREAM_LATEST_TAG=$(gh api repos/EchoMusicApp/Echo-Music/releases/latest --jq .tag_name 2>/dev/null || curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" https://api.github.com/repos/EchoMusicApp/Echo-Music/releases/latest | grep '"tag_name":' | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/' || echo "")
          echo "Upstream latest release tag: $UPSTREAM_LATEST_TAG"

          if [ -z "$UPSTREAM_LATEST_TAG" ]; then
            echo "Unable to determine upstream latest release tag. Exiting."
            echo "new_release_needed=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          FORCE_RELEASE="${{ github.event.inputs.force_release }}"
          
          # Check if this tag is already published or tagged on the fork
          FORK_HAS_RELEASE=$(gh api "repos/DeepBlue9789/Echo-Music/releases/tags/${UPSTREAM_LATEST_TAG}" --jq .tag_name 2>/dev/null || echo "")
          TAG_EXISTS_LOCALLY=$(git tag -l "$UPSTREAM_LATEST_TAG")

          if [ -n "$FORK_HAS_RELEASE" ] || [ -n "$TAG_EXISTS_LOCALLY" ]; then
            if [ "$FORCE_RELEASE" != "true" ]; then
              echo "Official release $UPSTREAM_LATEST_TAG is already published on this fork. No new release needed."
              echo "new_release_needed=false" >> $GITHUB_OUTPUT
              exit 0
            else
              echo "Force release flag enabled. Proceeding with sync for $UPSTREAM_LATEST_TAG."
            fi
          fi

          echo "New official upstream release detected: $UPSTREAM_LATEST_TAG"
          echo "new_release_needed=true" >> $GITHUB_OUTPUT
          echo "target_tag=$UPSTREAM_LATEST_TAG" >> $GITHUB_OUTPUT

      - name: Merge Upstream Release into Fork
        if: steps.check_upstream.outputs.new_release_needed == 'true'
        env:
          UPSTREAM_TAG: ${{ steps.check_upstream.outputs.target_tag }}
        run: |
          echo "Merging official release tag $UPSTREAM_TAG into fork main..."
          
          # Ensure we are on main
          git checkout main
          
          # Attempt merge of the official release tag
          if ! git merge "$UPSTREAM_TAG" --no-ff -m "Merge official upstream release $UPSTREAM_TAG into fork"; then
            echo "::error::Merge conflict encountered when merging official upstream release $UPSTREAM_TAG! Aborting merge to prevent publishing broken build."
            git merge --abort
            exit 1
          fi

          # Retain fork workflow files to prevent GitHub Actions permission rejection
          git rm -rf --cached .github/workflows/ 2>/dev/null || true
          git checkout HEAD -- .github/workflows/ 2>/dev/null || true
          git clean -fd .github/workflows/ 2>/dev/null || true
          git add -A
          if ! git diff-index --quiet HEAD --; then
            git commit --amend --no-edit || git commit -m "Merge official upstream release $UPSTREAM_TAG into fork"
          fi

          git push origin main
          git tag "$UPSTREAM_TAG"
          git push origin "$UPSTREAM_TAG"

  release:
    name: Trigger Official Release Build
    needs: sync-official-release
    if: needs.sync-official-release.outputs.new_release_needed == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/build-release.yml
    with:
      tag_name: ${{ needs.sync-official-release.outputs.target_tag }}
    secrets: inherit
