name: Sync Upstream & Auto Release

on:
  schedule:
    # Run every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      force_release:
        description: 'Force triggering a new release even if no new upstream commits'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  sync:
    name: Sync Upstream Changes
    runs-on: ubuntu-latest
    permissions:
      contents: write

    outputs:
      new_release_needed: ${{ steps.check_upstream.outputs.new_release_needed }}
      target_tag: ${{ steps.determine_tag.outputs.target_tag }}

    steps:
      - name: Checkout Fork
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git User
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add Upstream Remote & Fetch
        run: |
          git remote add upstream https://github.com/EchoMusicApp/Echo-Music.git || git remote set-url upstream https://github.com/EchoMusicApp/Echo-Music.git
          git fetch upstream main --no-tags

      - name: Check for New Upstream Commits
        id: check_upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LOCAL_HASH=$(git rev-parse HEAD)
          UPSTREAM_HASH=$(git rev-parse upstream/main)
          echo "Local HEAD: $LOCAL_HASH"
          echo "Upstream HEAD: $UPSTREAM_HASH"
          
          COMMITS_BEHIND=$(git rev-list --count HEAD..upstream/main)
          echo "Commits behind upstream: $COMMITS_BEHIND"
          
          UPSTREAM_LATEST_TAG=$(gh api repos/EchoMusicApp/Echo-Music/releases/latest --jq .tag_name 2>/dev/null || curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" https://api.github.com/repos/EchoMusicApp/Echo-Music/releases/latest | grep '"tag_name":' | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/' || echo "")
          echo "Upstream latest release tag: $UPSTREAM_LATEST_TAG"
          
          FORK_LATEST_TAG=$(gh api repos/DeepBlue9789/Echo-Music/releases/latest --jq .tag_name 2>/dev/null || curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" https://api.github.com/repos/DeepBlue9789/Echo-Music/releases/latest | grep '"tag_name":' | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/' || echo "")
          echo "Fork latest release tag: $FORK_LATEST_TAG"
          
          HAS_NEW_COMMITS=false
          if [ "$COMMITS_BEHIND" -gt 0 ]; then
            HAS_NEW_COMMITS=true
          fi
          
          NEW_RELEASE_NEEDED=false
          if [ "$HAS_NEW_COMMITS" = "true" ] || [ "${{ github.event.inputs.force_release }}" = "true" ] || ([ -n "$UPSTREAM_LATEST_TAG" ] && [ "$UPSTREAM_LATEST_TAG" != "$FORK_LATEST_TAG" ]); then
            NEW_RELEASE_NEEDED=true
          fi
          
          echo "has_new_commits=$HAS_NEW_COMMITS" >> $GITHUB_OUTPUT
          echo "new_release_needed=$NEW_RELEASE_NEEDED" >> $GITHUB_OUTPUT
          echo "upstream_tag=$UPSTREAM_LATEST_TAG" >> $GITHUB_OUTPUT

      - name: Merge Upstream into Fork
        if: steps.check_upstream.outputs.has_new_commits == 'true'
        run: |
          echo "Merging upstream/main into fork main..."
          git merge upstream/main --no-edit -m "Sync upstream Echo-Music changes into fork" || {
            echo "Conflict detected during merge. Resolving with fork preference for conflicting files..."
            git checkout --ours .
            git add -A
            git commit -m "Resolve merge conflicts prioritizing fork ListenTogether features"
          }
          git push origin main

      - name: Determine Target Release Tag
        id: determine_tag
        if: steps.check_upstream.outputs.new_release_needed == 'true'
        run: |
          VERSION=$(grep "versionName" app/build.gradle.kts | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
          TARGET_TAG="v${VERSION}"
          
          # If this tag already exists on fork, append timestamp
          if git rev-parse "$TARGET_TAG" >/dev/null 2>&1; then
            TARGET_TAG="v${VERSION}-$(date +'%Y%m%d%H%M')"
          fi
          
          echo "Target Release Tag: $TARGET_TAG"
          echo "target_tag=$TARGET_TAG" >> $GITHUB_OUTPUT
          git tag "$TARGET_TAG"
          git push origin "$TARGET_TAG" || echo "Tag push skipped or already exists"

  release:
    name: Trigger Release Build
    needs: sync
    if: needs.sync.outputs.new_release_needed == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/build-release.yml
    with:
      tag_name: ${{ needs.sync.outputs.target_tag }}
    secrets: inherit
