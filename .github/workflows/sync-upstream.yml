name: Sync Upstream Release

on:
  schedule:
    # Check official upstream for new releases every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      force_release:
        description: 'Force release sync even if tag exists locally'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-official-release:
    name: Check & Sync Official Upstream Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    outputs:
      new_release_needed: ${{ steps.check_upstream.outputs.new_release_needed }}
      target_tag: ${{ steps.check_upstream.outputs.target_tag }}

    steps:
      - name: Checkout Fork
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git User
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add Upstream Remote
        run: |
          git remote add upstream https://github.com/EchoMusicApp/Echo-Music.git || git remote set-url upstream https://github.com/EchoMusicApp/Echo-Music.git
          git fetch origin --tags --force || true

      - name: Check for New Upstream Release
        id: check_upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Fetch latest release tag from official Echo Music repository
          UPSTREAM_LATEST_TAG=$(gh api repos/EchoMusicApp/Echo-Music/releases/latest --jq .tag_name 2>/dev/null || curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" https://api.github.com/repos/EchoMusicApp/Echo-Music/releases/latest | grep '"tag_name":' | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/' || echo "")
          echo "Upstream latest release tag: $UPSTREAM_LATEST_TAG"

          if [ -z "$UPSTREAM_LATEST_TAG" ]; then
            echo "Unable to determine upstream latest release tag. Exiting."
            echo "new_release_needed=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          FORCE_RELEASE="${{ github.event.inputs.force_release }}"
          
          # Check if this release is already published on the fork
          if gh release view "$UPSTREAM_LATEST_TAG" --repo DeepBlue9789/Echo-Music >/dev/null 2>&1; then
            FORK_HAS_RELEASE="true"
          else
            FORK_HAS_RELEASE=""
          fi

          if [ -n "$FORK_HAS_RELEASE" ]; then
            if [ "$FORCE_RELEASE" != "true" ]; then
              echo "Official release $UPSTREAM_LATEST_TAG is already published on this fork. No new release needed."
              echo "new_release_needed=false" >> $GITHUB_OUTPUT
              exit 0
            else
              echo "Force release flag enabled. Proceeding with sync for $UPSTREAM_LATEST_TAG."
            fi
          fi

          echo "New official upstream release detected: $UPSTREAM_LATEST_TAG"
          echo "new_release_needed=true" >> $GITHUB_OUTPUT
          echo "target_tag=$UPSTREAM_LATEST_TAG" >> $GITHUB_OUTPUT

      - name: Merge Upstream Release into Fork
        if: steps.check_upstream.outputs.new_release_needed == 'true'
        env:
          UPSTREAM_TAG: ${{ steps.check_upstream.outputs.target_tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "============================================================"
          echo "Merging official release tag $UPSTREAM_TAG into fork main..."
          echo "============================================================"
          
          # Ensure we are on main
          git checkout main
          
          # Fetch the specific upstream release tag cleanly without clobbering other tags
          git fetch upstream tag "$UPSTREAM_TAG" --no-tags
          
          # ─────────────────────────────────────────────────────────────
          # Phase 1: Attempt clean merge with whitespace tolerance
          # ─────────────────────────────────────────────────────────────
          echo ""
          echo "--- Phase 1: Attempting merge with whitespace tolerance ---"
          MERGE_RESULT=0
          git merge -Xignore-space-change "$UPSTREAM_TAG" --no-ff -m "Merge official upstream release $UPSTREAM_TAG into fork" || MERGE_RESULT=$?
          
          if [ "$MERGE_RESULT" -ne 0 ]; then
            echo ""
            echo "--- Phase 2: Merge conflicts detected. Running universal conflict resolver ---"
            
            # Show conflicted files for logging
            echo "Conflicted files:"
            git diff --name-only --diff-filter=U || true
            echo "Modify/delete status:"
            git status --porcelain | grep -E '^(UD|DU|AA) ' || true
            
            # Run the enhanced conflict resolver
            RESOLVER_RESULT=0
            python3 .github/scripts/resolve_upstream_merge.py || RESOLVER_RESULT=$?
            
            if [ "$RESOLVER_RESULT" -ne 0 ]; then
              echo ""
              echo "--- Phase 3: Resolver could not fully resolve. Creating sync PR ---"
              
              SYNC_BRANCH="sync/upstream-${UPSTREAM_TAG}"
              
              # Protect fork workflows before committing
              git rm -rf --cached .github/workflows/ 2>/dev/null || true
              git checkout HEAD -- .github/workflows/ 2>/dev/null || true
              git clean -fd .github/workflows/ 2>/dev/null || true
              
              git add -A
              git commit -m "WIP: Merge upstream release $UPSTREAM_TAG with unresolved conflicts" || true
              
              # Push to sync branch
              git checkout -b "$SYNC_BRANCH" 2>/dev/null || git branch -f "$SYNC_BRANCH" HEAD
              git push origin "$SYNC_BRANCH" --force
              
              # Create PR with detailed information using a temporary file
              REMAINING_CONFLICTS=$(git diff --name-only --diff-filter=U 2>/dev/null || echo "Check branch for details")
              PR_BODY_FILE=$(mktemp)
              echo "## Upstream Release $UPSTREAM_TAG Sync" > "$PR_BODY_FILE"
              echo "" >> "$PR_BODY_FILE"
              echo "The automated conflict resolver handled most conflicts but some files need manual review." >> "$PR_BODY_FILE"
              echo "" >> "$PR_BODY_FILE"
              echo "### What the resolver did:" >> "$PR_BODY_FILE"
              echo "- Unified import statements" >> "$PR_BODY_FILE"
              echo "- Resolved whitespace-only conflicts" >> "$PR_BODY_FILE"
              echo "- Preserved fork workflows" >> "$PR_BODY_FILE"
              echo "- Handled modify/delete conflicts" >> "$PR_BODY_FILE"
              echo "- Merged version catalog entries" >> "$PR_BODY_FILE"
              echo "- Updated build.gradle.kts versioning" >> "$PR_BODY_FILE"
              echo "" >> "$PR_BODY_FILE"
              echo "### Remaining conflicts:" >> "$PR_BODY_FILE"
              echo '```' >> "$PR_BODY_FILE"
              echo "$REMAINING_CONFLICTS" >> "$PR_BODY_FILE"
              echo '```' >> "$PR_BODY_FILE"
              echo "" >> "$PR_BODY_FILE"
              echo "### After manual resolution:" >> "$PR_BODY_FILE"
              echo "1. Resolve remaining conflicts in the conflicted files" >> "$PR_BODY_FILE"
              echo "2. Merge this PR" >> "$PR_BODY_FILE"
              echo "3. Run the Fork Sub-Version Release workflow to publish" >> "$PR_BODY_FILE"

              gh pr create --repo DeepBlue9789/Echo-Music \
                --title "Sync upstream release $UPSTREAM_TAG" \
                --body-file "$PR_BODY_FILE" \
                --base main --head "$SYNC_BRANCH" || true
              rm -f "$PR_BODY_FILE"

              echo "::error::Opened PR for manual review of $UPSTREAM_TAG."
              git checkout main
              git merge --abort 2>/dev/null || true
              exit 1
            fi
          fi

          # ─────────────────────────────────────────────────────────────
          # Phase 4: Post-merge — protect fork workflow files
          # ─────────────────────────────────────────────────────────────
          echo ""
          echo "--- Phase 4: Protecting fork workflow files ---"

          # Ensure .github/workflows/ is byte-for-byte identical to fork HEAD
          # This prevents GITHUB_TOKEN permission rejections on push
          git rm -rf --cached .github/workflows/ 2>/dev/null || true
          git checkout HEAD -- .github/workflows/ 2>/dev/null || true
          git clean -fd .github/workflows/ 2>/dev/null || true

          # Stage everything and commit
          git add -A
          if ! git diff-index --quiet HEAD --; then
            git commit --amend --no-edit || git commit -m "Merge official upstream release $UPSTREAM_TAG into fork"
          fi

          # ─────────────────────────────────────────────────────────────
          # Phase 5: Push and tag
          # ─────────────────────────────────────────────────────────────
          echo ""
          echo "--- Phase 5: Pushing merge and release tag ---"
          git push origin main
          git tag -f "$UPSTREAM_TAG"
          git push origin "$UPSTREAM_TAG" --force

          echo ""
          echo "============================================================"
          echo "Successfully merged and tagged $UPSTREAM_TAG!"
          echo "============================================================"

  release:
    name: Trigger Official Release Build
    needs: sync-official-release
    if: needs.sync-official-release.outputs.new_release_needed == 'true'
    uses: ./.github/workflows/build-release.yml
    with:
      tag_name: ${{ needs.sync-official-release.outputs.target_tag }}
    secrets: inherit

