name: Build & Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.0.0-p2p)'
        required: true
        default: 'v1.0.0-p2p'

jobs:
  build:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Build Release APKs
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease || ./gradlew assembleDebug

      - name: Locate APKs
        id: locate_apk
        run: |
          mkdir -p release-apks
          find app/build/outputs/apk/ -name "*.apk" -exec cp {} release-apks/ \;
          ls -la release-apks/

      - name: Determine Release Tag
        id: release_tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "TAG=${{ github.event.inputs.tag_name }}" >> $GITHUB_ENV
          else
            echo "TAG=${{ github.ref_name }}" >> $GITHUB_ENV
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Echo Music ${{ env.TAG }}
          body: |
            ## Echo Music Release (${{ env.TAG }})
            - Symmetric Peer-to-Peer (P2P) Partner synchronization over Tailscale / LAN
            - Direct embedded WebSocket server & cooperative buffering
            - In-room chat & track suggestions
            - Dynamic update checker integration
          files: release-apks/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
