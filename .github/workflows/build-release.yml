name: Build & Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.2.3)'
        required: true
        default: 'v1.2.3'
  workflow_call:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.2.3)'
        required: true
        type: string

jobs:
  build:
    name: Build & Publish Universal Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Determine Release Tag
        id: release_tag
        run: |
          if [ -n "${{ inputs.tag_name }}" ]; then
            TAG="${{ inputs.tag_name }}"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          echo "TAG=$TAG" >> $GITHUB_ENV
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Signing Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding repository secret KEYSTORE_BASE64 into keystore.jks..."
            echo "$KEYSTORE_BASE64" | base64 -d > keystore.jks
          elif [ ! -f "keystore.jks" ] && [ ! -f "app/keystore/release.keystore" ]; then
            echo "No custom release keystore found. Generating dedicated CI release keystore..."
            keytool -genkey -v -keystore keystore.jks -alias echorelease -keyalg RSA -keysize 2048 -validity 10000 -storepass echopassword -keypass echopassword -dname "CN=Echo Music, OU=Mobile, O=Echo, L=Unknown, S=Unknown, C=US"
            echo "STORE_PASSWORD=echopassword" >> $GITHUB_ENV
            echo "KEY_PASSWORD=echopassword" >> $GITHUB_ENV
            echo "KEY_ALIAS=echorelease" >> $GITHUB_ENV
          fi

      - name: Build Universal GMS Release APK
        env:
          KEY_ALIAS: ${{ env.KEY_ALIAS || secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ env.KEY_PASSWORD || secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ env.STORE_PASSWORD || secrets.STORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleUniversalGmsRelease --no-daemon --stacktrace -Dorg.gradle.java.home="$JAVA_HOME"

      - name: Prepare Release Assets & Changelog
        id: prepare_assets
        run: |
          mkdir -p release-apks
          
          # Find the universal release APK
          RELEASE_APK=$(find app/build/outputs/apk/ -name "*release*.apk" | head -n 1)
          if [ -z "$RELEASE_APK" ]; then
            echo "No release APK found, searching for any non-debug APK..."
            RELEASE_APK=$(find app/build/outputs/apk/ -name "*.apk" ! -name "*debug*" | head -n 1)
          fi
          
          if [ -n "$RELEASE_APK" ]; then
            echo "Found release APK: $RELEASE_APK"
            cp "$RELEASE_APK" "release-apks/app-universal-gms-release.apk"
            cp "$RELEASE_APK" "release-apks/EchoMusic-${{ env.TAG }}-universal.apk"
          else
            echo "Error: Release APK not generated!"
            exit 1
          fi
          
          # Generate changelog.json matching echomusicupdater format
          cat << 'EOF' > release-apks/changelog.json
          {
            "description": "Echo Music with Listen Together Real-Time Music Synchronization Engine",
            "changelog": [
              {
                "title": "Listen Together Real-Time Synchronization Engine",
                "items": [
                  "Server-Authoritative Virtual Timeline synchronization with millisecond precision",
                  "Dynamic Pitch-Preserving Soft Slew for inaudible playback drift correction",
                  "Cooperative Multi-Device Buffer Barrier across track transitions and mid-stream buffering",
                  "Zero-stutter playback resume with decoder flush prevention",
                  "Edge-anchored floating chat bubble with system cross-window background blur",
                  "Full Peer-to-Peer mesh over Tailscale VPN and Local Wi-Fi"
                ]
              }
            ]
          }
          EOF
          
          ls -la release-apks/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Echo Music ${{ env.TAG }}
          body: |
            ## Echo Music Release (${{ env.TAG }})
            
            ### Listen Together Enhancements
            - **Server-Authoritative Virtual Timeline Synchronization Engine**: Continuous timeline model ($p(t) = p_{ref} + r \cdot (t - t_{ref})$) with cooperative buffer barriers.
            - **Seamless Two-Phase Scheduled Play**: Millisecond-precise synchronized track starts without decoder flushes or audio cutouts.
            - **Pitch-Preserving Dynamic Soft Slew**: Invisible speed corrections ($0.96\times$ to $1.10\times$) keeping devices tightly in sync without audio distortion.
            - **Edge-Anchored Floating Chat Bubble**: Circular floating bubble remains rock solid at the screen edge while message previews expand naturally beside it.
            - **Hardware-Accelerated Window Blur**: System-wide cross-window backdrop blur on supported Android versions with custom tint and opacity sliders.
            - **Peer-to-Peer Mesh Mode**: Direct connection over Tailscale mesh and local Wi-Fi without third-party server requirements.
          files: |
            release-apks/*.apk
            release-apks/changelog.json
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
