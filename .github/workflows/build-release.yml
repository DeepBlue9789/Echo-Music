name: Build & Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.2.3)'
        required: true
        default: 'v1.2.3'
  workflow_call:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.2.3)'
        required: true
        type: string

jobs:
  build:
    name: Build & Publish Universal Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Determine Release Tag
        id: release_tag
        run: |
          if [ -n "${{ inputs.tag_name }}" ]; then
            TAG="${{ inputs.tag_name }}"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          echo "TAG=$TAG" >> $GITHUB_ENV
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Signing Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding repository secret KEYSTORE_BASE64 into keystore.jks..."
            echo "$KEYSTORE_BASE64" | base64 -d > keystore.jks
          elif [ -f "app/keystore/release.keystore" ]; then
            echo "Using tracked permanent release keystore from app/keystore/release.keystore..."
            cp app/keystore/release.keystore keystore.jks
          elif [ -f "keystore.jks" ]; then
            echo "Using root keystore.jks..."
          else
            echo "Error: No release keystore found! Aborting to prevent generating an ephemeral key."
            exit 1
          fi

          echo "STORE_PASSWORD=${{ secrets.STORE_PASSWORD || 'echopassword' }}" >> $GITHUB_ENV
          echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD || 'echopassword' }}" >> $GITHUB_ENV
          echo "KEY_ALIAS=${{ secrets.KEY_ALIAS || 'echorelease' }}" >> $GITHUB_ENV

      - name: Build Universal GMS Release APK
        env:
          KEY_ALIAS: ${{ env.KEY_ALIAS }}
          KEY_PASSWORD: ${{ env.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ env.STORE_PASSWORD }}
        run: |
          chmod +x gradlew
          
          # Clean tag to version name (e.g. v1.2.5-d1 -> 1.2.5-d1)
          CLEAN_VERSION="${TAG#v}"
          BASE_NUMERIC=$(echo "$CLEAN_VERSION" | sed -E 's/-d[0-9]+//' | sed -E 's/-.*//')
          MAJOR=$(echo "$BASE_NUMERIC" | cut -d. -f1)
          MINOR=$(echo "$BASE_NUMERIC" | cut -d. -f2)
          PATCH=$(echo "$BASE_NUMERIC" | cut -d. -f3)
          D_NUM=$(echo "$CLEAN_VERSION" | sed -nE 's/.*-d([0-9]+)/\1/p')
          D_NUM=${D_NUM:-0}
          
          COMPUTED_CODE=$(( ${MAJOR:-1} * 1000000 + ${MINOR:-2} * 10000 + ${PATCH:-5} * 100 + D_NUM ))
          echo "Building Universal Release: versionName=$CLEAN_VERSION, versionCode=$COMPUTED_CODE"
          
          export APP_VERSION_NAME="$CLEAN_VERSION"
          export APP_VERSION_CODE="$COMPUTED_CODE"
          
          ./gradlew assembleUniversalGmsRelease \
            -PversionName="$CLEAN_VERSION" \
            -PversionCode="$COMPUTED_CODE" \
            --no-daemon --stacktrace -Dorg.gradle.java.home="$JAVA_HOME"

      - name: Prepare Release Assets & Changelog
        id: prepare_assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p release-apks
          
          # Find the universal release APK
          RELEASE_APK=$(find app/build/outputs/apk/ -name "*release*.apk" | head -n 1)
          if [ -z "$RELEASE_APK" ]; then
            echo "No release APK found, searching for any non-debug APK..."
            RELEASE_APK=$(find app/build/outputs/apk/ -name "*.apk" ! -name "*debug*" | head -n 1)
          fi
          
          if [ -n "$RELEASE_APK" ]; then
            echo "Found release APK: $RELEASE_APK"
            cp "$RELEASE_APK" "release-apks/app-universal-gms-release.apk"
            cp "$RELEASE_APK" "release-apks/EchoMusic-${{ env.TAG }}-universal.apk"
          else
            echo "Error: Release APK not generated!"
            exit 1
          fi
          
          if [[ "${{ env.TAG }}" =~ -d[0-9]+ ]]; then
            echo "Fork sub-version release detected: ${{ env.TAG }}"
            python3 << 'EOF'
import os, subprocess, json

tag = os.environ.get("TAG", "")
try:
    tags_output = subprocess.check_output(["git", "tag", "--sort=-v:refname"], text=True).splitlines()
    prev_tag = next((t for t in tags_output if t != tag and t.startswith("v")), None)
except Exception:
    prev_tag = None

if prev_tag:
    git_range = f"{prev_tag}..HEAD"
    log_cmd = ["git", "log", git_range, "--pretty=format:%s"]
else:
    log_cmd = ["git", "log", "-n", "15", "--pretty=format:%s"]

try:
    commits = subprocess.check_output(log_cmd, text=True).splitlines()
except Exception:
    commits = []

filtered = []
for c in commits:
    c_clean = c.strip()
    if not c_clean:
        continue
    low = c_clean.lower()
    if any(k in low for k in ["sync upstream", "merge branch", "merge remote", "[skip ci]"]):
        continue
    filtered.append(c_clean)

if not filtered:
    filtered = ["Bug fixes, performance improvements, and fork enhancements."]

body_md = f"## Echo Music Release ({tag})\n\n### Fork Changes:\n"
for item in filtered:
    body_md += f"- {item}\n"
body_md += "\n---\n*Echo Music Fork with Listen Together Real-Time Synchronization & 320kbps High-Fidelity Audio.*"

with open("release_body.md", "w", encoding="utf-8") as f:
    f.write(body_md)

changelog_data = {
    "description": f"Echo Music {tag} update",
    "changelog": [
        {
            "title": f"Changes in {tag}",
            "items": filtered
        }
    ]
}

with open("release-apks/changelog.json", "w", encoding="utf-8") as f:
    json.dump(changelog_data, f, indent=2)
EOF
          else
            echo "Official upstream release detected: ${{ env.TAG }}"
            python3 << 'EOF'
import os, urllib.request, json

tag = os.environ.get("TAG", "")
token = os.environ.get("GITHUB_TOKEN", "")

headers = {"User-Agent": "EchoMusic-CI"}
if token:
    headers["Authorization"] = f"Bearer {token}"

req = urllib.request.Request(
    f"https://api.github.com/repos/EchoMusicApp/Echo-Music/releases/tags/{tag}",
    headers=headers
)

upstream_body = ""
changelog_json_downloaded = False

try:
    with urllib.request.urlopen(req) as resp:
        data = json.loads(resp.read().decode("utf-8"))
        upstream_body = data.get("body", "")
        assets = data.get("assets", [])
        for asset in assets:
            if asset.get("name") == "changelog.json":
                dl_url = asset.get("browser_download_url")
                urllib.request.urlretrieve(dl_url, "release-apks/changelog.json")
                changelog_json_downloaded = True
                break
except Exception as e:
    print(f"Notice: Could not fetch upstream release notes for {tag}: {e}")

if not upstream_body:
    upstream_body = f"Official Echo Music Release {tag}"

body_md = f"{upstream_body}\n\n---\n*Echo Music Fork with Listen Together Real-Time Synchronization & 320kbps High-Fidelity Audio.*"
with open("release_body.md", "w", encoding="utf-8") as f:
    f.write(body_md)

if not changelog_json_downloaded:
    items = []
    for line in upstream_body.splitlines():
        line_s = line.strip()
        if line_s.startswith("- ") or line_s.startswith("* "):
            item_text = line_s[2:].strip()
            if item_text:
                items.append(item_text)

    if not items:
        items = [f"Official Echo Music upstream release {tag}."]

    changelog_data = {
        "description": f"Official Echo Music {tag} Release",
        "changelog": [
            {
                "title": f"What's New in {tag}",
                "items": items
            }
        ]
    }
    with open("release-apks/changelog.json", "w", encoding="utf-8") as f:
        json.dump(changelog_data, f, indent=2)
EOF
          fi
          
          ls -la release-apks/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Echo Music ${{ env.TAG }}
          body_path: release_body.md
          files: |
            release-apks/*.apk
            release-apks/changelog.json
          draft: false
          prerelease: false
          make_latest: "true"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
